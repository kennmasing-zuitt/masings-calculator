# Nginx reverse proxy in front of the Next.js container ("app" service)

upstream nextjs {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;   # replace with your domain, e.g. calculator.example.com

    server_tokens off;
    client_max_body_size 10m;

    # Compress text responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Build assets (Next.js already marks them "immutable" for long caching)
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # Everything else goes to Next.js
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support (harmless if unused)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Simple health endpoint for uptime checks
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

# Sets "Connection: upgrade" only for WebSocket requests
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
