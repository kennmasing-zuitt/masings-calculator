services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: masings-calculator:latest
    container_name: masings-calculator
    restart: unless-stopped
    environment:
      NODE_ENV: production
    # no "ports:" - the Nginx container reaches it over the web network
    networks:
      default:
      web:
        aliases: [masings-calculator]

networks:
  web:
    external: true                 # shared with the Nginx proxy