services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: redux-calculator-next:latest
    container_name: redux-calculator-next
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"          # only reachable by nginx, not from outside
    networks:
      - web

  nginx:
    image: nginx:1.27-alpine
    container_name: redux-calculator-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - web

networks:
  web:
    driver: bridge
